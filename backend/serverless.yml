service: stock-market-chatbot

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  environment:
    # Secrets are resolved at deploy time from SSM Parameter Store.
    # See docs/DEPLOYMENT.md#secrets. Never hardcode values here.
    REPLICATE_API_KEY: ${ssm:/stockai/${sls:stage}/replicate-api-key}
    NEWS_API_KEY: ${ssm:/stockai/${sls:stage}/news-api-key}
    ALPHA_VANTAGE_API_KEY: ${ssm:/stockai/${sls:stage}/alpha-vantage-key}
    RAPIDAPI_KEY: ${ssm:/stockai/${sls:stage}/rapidapi-key}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

functions:
  stockPrice:
    handler: functions/stock-price.handler
    events:
      - http:
          path: /stock-price
          method: get
          cors: true
    timeout: 30
    memorySize: 256

  aiPrediction:
    handler: functions/ai-prediction.handler
    events:
      - http:
          path: /ai-prediction
          method: get
          cors: true
    timeout: 60
    memorySize: 512

  technicalAnalysis:
    handler: functions/technical-analysis.handler
    events:
      - http:
          path: /technical-analysis
          method: get
          cors: true
    timeout: 30
    memorySize: 256

  marketNews:
    handler: functions/market-news.handler
    events:
      - http:
          path: /market-news
          method: get
          cors: true
    timeout: 30
    memorySize: 256

  # Auth Functions
  auth:
    handler: functions/auth.handler
    events:
      - http:
          path: /auth/{action}
          method: post
          cors: true
    timeout: 30
    memorySize: 256
    environment:
      USER_POOL_ID: !Ref UserPool
      USER_POOL_CLIENT_ID: !Ref UserPoolClient
      USER_TABLE: !Ref UserTable

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3001
    host: 0.0.0.0

package:
  exclude:
    - node_modules/**
    - .git/**
    - .env*
    - README.md
    - aws-lambda/**

resources:
  Resources:
    ApiGatewayRestApi:
      Type: AWS::ApiGateway::RestApi
      Properties:
        Name: StockMarketChatbotAPI
        Description: API for Stock Market Chatbot
        EndpointConfiguration:
          Types:
            - REGIONAL

    # Cognito User Pool
    UserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: StockChatUserPool
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
        Schema:
          - Name: email
            AttributeDataType: String
            Required: true
            Mutable: true
          - Name: name
            AttributeDataType: String
            Required: true
            Mutable: true

    # Cognito User Pool Client
    UserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        UserPoolId: !Ref UserPool
        ClientName: StockChatClient
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        PreventUserExistenceErrors: ENABLED

    # DynamoDB Table for User Data
    UserTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: StockChatUsers
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST
