service: stock-market-chatbot

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  logRetentionInDays: 14
  environment:
    STAGE: ${sls:stage}
    # Replicate model id; verify the latest IBM Granite instruct model at replicate.com/ibm-granite
    LLM_MODEL: ${env:LLM_MODEL, 'ibm-granite/granite-3.3-8b-instruct'}
    ALLOWED_ORIGINS: ${self:custom.allowedOrigins.${sls:stage}}
    # Secrets are resolved at deploy time from SSM Parameter Store.
    # See docs/DEPLOYMENT.md#1-secrets. Never hardcode values here.
    # Each key is injected only into the function that uses it (see `functions:` below).
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
          Resource: "*"

custom:
  # Comma-separated origins allowed to call the API (checked in lib/http.js).
  # The live site currently talks to the dev stage, so dev allows it too.
  allowedOrigins:
    dev: http://localhost:5173,http://localhost:8080,https://stockai.gavinadlan.my.id
    prod: https://stockai.gavinadlan.my.id
  # Same list for API Gateway preflight (OPTIONS) responses.
  corsOrigins:
    dev:
      - http://localhost:5173
      - http://localhost:8080
      - https://stockai.gavinadlan.my.id
    prod:
      - https://stockai.gavinadlan.my.id
  cors: &cors
    origins: ${self:custom.corsOrigins.${sls:stage}}
    headers:
      - Content-Type
      - Authorization
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    platform: node
    exclude:
      - '@aws-sdk/*'
  serverless-offline:
    httpPort: 3001
    host: 0.0.0.0

plugins:
  - serverless-esbuild
  - serverless-offline

package:
  individually: true

functions:
  health:
    handler: functions/health.handler
    events:
      - http:
          path: /health
          method: get
          cors: *cors
    timeout: 5
    memorySize: 128

  stockPrice:
    handler: functions/stock-price.handler
    events:
      - http:
          path: /stock-price
          method: get
          cors: *cors
    timeout: 15
    memorySize: 256

  aiPrediction:
    handler: functions/ai-prediction.handler
    events:
      - http:
          path: /ai-prediction
          method: get
          cors: *cors
    # API Gateway REST integrations time out at 29s; keep the function below that.
    # Budget: quote <= 5s + LLM deadline 18s (see functions/ai-prediction.js).
    timeout: 28
    memorySize: 512
    environment:
      REPLICATE_API_KEY: ${ssm:/stockai/${sls:stage}/replicate-api-key}

  technicalAnalysis:
    handler: functions/technical-analysis.handler
    events:
      - http:
          path: /technical-analysis
          method: get
          cors: *cors
    timeout: 15
    memorySize: 256

  marketNews:
    handler: functions/market-news.handler
    events:
      - http:
          path: /market-news
          method: get
          cors: *cors
    timeout: 15
    memorySize: 256
    environment:
      NEWS_API_KEY: ${ssm:/stockai/${sls:stage}/news-api-key}

resources:
  Resources:
    ApiGatewayRestApi:
      Type: AWS::ApiGateway::RestApi
      Properties:
        Name: StockMarketChatbotAPI
        Description: API for Stock Market Chatbot
        EndpointConfiguration:
          Types:
            - REGIONAL

    # Cognito User Pool
    UserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: StockChatUserPool
        UsernameAttributes:
          - email
        AutoVerifiedAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: true
            RequireLowercase: true
            RequireNumbers: true
            RequireSymbols: true
        Schema:
          - Name: email
            AttributeDataType: String
            Required: true
            Mutable: true
          - Name: name
            AttributeDataType: String
            Required: true
            Mutable: true

    # Cognito User Pool Client
    UserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        UserPoolId: !Ref UserPool
        ClientName: StockChatClient
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        PreventUserExistenceErrors: ENABLED

    # Legacy table from the removed auth Lambda. Kept with Retain so a deploy can
    # never delete data. Remove (and delete manually if empty) in S1-04.
    UserTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: StockChatUsers
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

  Outputs:
    UserPoolId:
      Description: Cognito user pool id (frontend VITE_USER_POOL_ID)
      Value: !Ref UserPool
    UserPoolClientId:
      Description: Cognito app client id (frontend VITE_USER_POOL_CLIENT_ID)
      Value: !Ref UserPoolClient
