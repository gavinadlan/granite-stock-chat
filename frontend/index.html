<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>StockAI: stock prices, indicators and news with their sources</title>
    <meta name="description" content="Ask about US and Indonesian stocks and get prices, technical indicators and news with source and timestamp. Data may be delayed. Not financial advice." />
    <meta name="author" content="StockAI" />

    <meta property="og:title" content="StockAI: stock prices, indicators and news with their sources" />
    <meta property="og:description" content="Ask about US and Indonesian stocks and get prices, technical indicators and news with source and timestamp. Data may be delayed. Not financial advice." />
    <meta property="og:type" content="website" />
    <!-- TODO(S5-06): add og:image and twitter:image once a share image exists. -->

    <meta name="twitter:card" content="summary" />
    
    <script>
      // Initialize dark mode before page render to prevent flash
      (function() {
        try {
          const stored = localStorage.getItem('user_settings');
          if (stored) {
            const settings = JSON.parse(stored);
            if (settings.darkMode) {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {
          // Ignore errors
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
