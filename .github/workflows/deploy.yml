name: Deploy (manual)

# Manual deploy until the OIDC pipeline of Sprint 5 (S5-03) replaces it.
# Required in each GitHub Environment (dev / prod):
#   secrets:   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
#   variables: AWS_REGION, S3_BUCKET, CF_DISTRIBUTION_ID,
#              VITE_API_URL, VITE_USER_POOL_ID, VITE_USER_POOL_CLIENT_ID
# Backend secrets are read from SSM at deploy time (docs/DEPLOYMENT.md).

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage == 'prod' && 'production' || 'development' }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      - name: Deploy backend
        run: npm run deploy:${{ inputs.stage }} -w backend

      - name: Build frontend
        run: npm run build -w frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_USER_POOL_ID: ${{ vars.VITE_USER_POOL_ID }}
          VITE_USER_POOL_CLIENT_ID: ${{ vars.VITE_USER_POOL_CLIENT_ID }}
          VITE_AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Upload frontend
        run: |
          aws s3 sync frontend/dist/ "s3://${{ vars.S3_BUCKET }}" --delete \
            --cache-control "public,max-age=31536000,immutable" --exclude index.html
          aws s3 cp frontend/dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache"
          aws cloudfront create-invalidation --distribution-id "${{ vars.CF_DISTRIBUTION_ID }}" --paths "/index.html"
